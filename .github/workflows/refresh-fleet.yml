name: Refresh fleet registry

# Re-seeds the vessel registry from Wikidata and opens a PR when it changed.
# New ships and corrected specs land as reviewable diffs rather than silent
# edits, so the dataset stays current without anyone running a script.

on:
  schedule:
    # Weekly, Mondays 05:00 UTC (before the Dependabot run).
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-fleet
  cancel-in-progress: false

jobs:
  refresh:
    name: Re-seed from Wikidata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Seed fleet registry
        run: npm run seed:fleet

      - name: Validate regenerated registry
        run: npm test

      - name: Open PR if the registry changed
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/refresh-fleet-registry
          base: main
          title: 'chore(data): refresh fleet registry from Wikidata'
          commit-message: 'chore(data): refresh fleet registry from Wikidata'
          labels: data, automated
          delete-branch: true
          add-paths: public/data/fleet-registry.json
          body: |
            Automated re-seed of `public/data/fleet-registry.json` from the
            Wikidata Query Service (CC0).

            Generated by `.github/workflows/refresh-fleet.yml` via
            `npm run seed:fleet`. The registry's test suite passed before this
            PR was opened.

            Review the diff for new vessels, corrected specifications, and any
            change in the `stats` block (especially `invalidImoChecksums`).
