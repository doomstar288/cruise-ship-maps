name: Refresh fleet registry

# Re-seeds the vessel registry from Wikidata and opens a PR when it changed.
# New ships and corrected specs land as reviewable diffs rather than silent
# edits, so the dataset stays current without anyone running a script.
#
# The seeder refuses to write a refresh that looks broken (a sudden drop in
# ships returned, or a major line losing a quarter of its fleet). That fails
# this run instead of opening a PR; the run summary shows what tripped. If the
# change is genuine, re-run manually with "allow_large_change" ticked.
#
# The PR is opened with a GitHub App token, because GitHub never triggers
# workflows for a PR created with the built-in GITHUB_TOKEN — the required
# status checks would never run and the PR could never be merged. Setup:
# install an app with contents:write + pull-requests:write on this repo, then
# set the FLEET_BOT_APP_ID variable and FLEET_BOT_PRIVATE_KEY secret. Without
# them the job still runs and still pushes the branch, falling back to
# GITHUB_TOKEN (so the PR opens, but its checks stay pending).

on:
  schedule:
    # Weekly, Mondays 05:00 UTC (before the Dependabot run).
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      allow_large_change:
        description: 'Publish even if guardrails trip (confirm the changes are genuine first)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-fleet
  cancel-in-progress: false

jobs:
  refresh:
    name: Re-seed from Wikidata
    runs-on: ubuntu-latest
    steps:
      # `vars` is readable in an `if`, so the app id lives in a variable and
      # only the private key is a secret.
      - name: Mint a GitHub App token
        id: app-token
        if: vars.FLEET_BOT_APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.FLEET_BOT_APP_ID }}
          private-key: ${{ secrets.FLEET_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Seed fleet registry
        env:
          ALLOW_LARGE_CHANGE: ${{ inputs.allow_large_change && '--allow-large-change' || '' }}
        run: npm run seed:fleet -- --summary "$RUNNER_TEMP/fleet-summary.md" $ALLOW_LARGE_CHANGE

      - name: Publish change summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/fleet-summary.md" ]; then
            cat "$RUNNER_TEMP/fleet-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate regenerated registry
        run: npm test

      - name: Compose PR body
        run: |
          {
            cat "$RUNNER_TEMP/fleet-summary.md"
            echo
            echo '---'
            echo
            echo 'Automated re-seed of `public/data/fleet-registry.json` from the Wikidata'
            echo 'Query Service (CC0), with `scripts/fleet-overrides.json` applied on top.'
            echo 'Generated by `.github/workflows/refresh-fleet.yml`; the test suite passed'
            echo 'before this PR was opened.'
            echo
            echo 'Ambiguous or wrong values: fix the Wikidata item where possible, otherwise'
            echo 'add an entry to `scripts/fleet-overrides.json` and run `npm run seed:fleet`.'
          } > "$RUNNER_TEMP/pr-body.md"

      - name: Open PR if the registry changed
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          branch: chore/refresh-fleet-registry
          base: main
          title: 'chore(data): refresh fleet registry from Wikidata'
          commit-message: 'chore(data): refresh fleet registry from Wikidata'
          labels: data, automated
          delete-branch: true
          add-paths: public/data/fleet-registry.json
          body-path: ${{ runner.temp }}/pr-body.md
