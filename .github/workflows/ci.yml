name: CI

on:
  push:
    branches: [main]
  # No branch filter, so stacked PRs (which target a feature branch rather than
  # main) still get linted, tested and built before merge.
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (with coverage)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7
