name: CodeQL

on:
  push:
    branches: [main]
  # No branch filter, so stacked PRs are analyzed too, not just those
  # targeting main.
  pull_request:
  schedule:
    # Weekly scan (Mondays 06:00 UTC) to catch newly disclosed patterns.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  # Lets the CodeQL action read the workflow run it belongs to.
  actions: read

jobs:
  analyze:
    name: Analyze (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      # Code scanning is not enabled on this private repository (it needs GitHub
      # Code Security), so uploading to the Security tab fails with "Code
      # scanning is not enabled". Analyze without uploading and gate on the SARIF
      # below instead. If code scanning is enabled later, switch `upload` back to
      # `always`, restore `security-events: write`, and drop the gate step.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
          upload: never
          output: sarif-results

      - name: Upload SARIF report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif
          path: sarif-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail on CodeQL findings
        run: |
          node --input-type=module <<'EOF'
          import { readdirSync, readFileSync, appendFileSync } from 'node:fs';

          const dir = 'sarif-results';
          const findings = [];
          for (const file of readdirSync(dir).filter((f) => f.endsWith('.sarif'))) {
            const sarif = JSON.parse(readFileSync(`${dir}/${file}`, 'utf8'));
            for (const run of sarif.runs ?? []) {
              for (const result of run.results ?? []) {
                const loc = result.locations?.[0]?.physicalLocation;
                findings.push({
                  rule: result.ruleId,
                  level: result.level ?? 'warning',
                  where: `${loc?.artifactLocation?.uri ?? '?'}:${loc?.region?.startLine ?? '?'}`,
                  message: (result.message?.text ?? '').replace(/\s+/g, ' '),
                });
              }
            }
          }

          const summary = findings.length
            ? [
                `### CodeQL: ${findings.length} finding(s)`,
                '',
                '| Rule | Level | Location | Message |',
                '|---|---|---|---|',
                ...findings.map((f) => `| \`${f.rule}\` | ${f.level} | \`${f.where}\` | ${f.message.replace(/\|/g, '\\|')} |`),
              ].join('\n')
            : '### CodeQL: no findings';
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);

          for (const f of findings) {
            const [file, line] = f.where.split(':');
            console.log(`::error file=${file},line=${line},title=${f.rule}::${f.message}`);
          }
          if (findings.length) process.exit(1);
          console.log('No CodeQL findings.');
          EOF
