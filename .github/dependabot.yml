version: 2
updates:
  # Keep npm dependencies patched, grouped to reduce PR noise.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
    ignore:
      # ESLint 10 is blocked until eslint-plugin-react supports it (7.37 peers ^9.7);
      # a grouped bump that includes it cannot install. Revisit when the plugin does.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']

  # Keep GitHub Actions pinned to current majors.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
